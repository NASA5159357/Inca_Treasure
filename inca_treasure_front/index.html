<!DOCTYPE html>
<img src="./img/signature.png" class="page-signature">
<img src="./img/xidian.jpg" class="page-xidian">
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>印加寻宝 - 房间列表</title>
  <!-- 引入通用样式+房间页样式 -->
  <link rel="stylesheet" href="./css/common.css">
  <link rel="stylesheet" href="./css/room.css">
  <!-- 引入Socket.io客户端（CDN，对接张三的Node.js后端） -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
  <div class="room-page">
    <!-- 标题 -->
    <h1 class="room-title">印加寻宝</h1>
    
    <!-- 房间操作区 -->
    <div class="room-ops">
      <button id="create-room" class="btn">创建房间</button>
      <input type="text" id="room-id-input" placeholder="输入房间号">
      <button id="join-room" class="btn">加入房间</button>
    </div>
    
    <!-- 房间列表区 -->
    <div class="room-list">
      <h2 class="room-list-title">当前可用房间</h2>
      <div id="room-list-container">
        <!-- 后端返回的房间列表会渲染到这里（对接张三） -->
        <div class="room-item">
          <div class="room-item-info">
            <div class="room-item-id">房间号：【后端动态渲染】</div>
            <div class="room-item-player">玩家数：0/8</div>
          </div>
          <button class="btn join-room-btn">加入</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 通用提示框 -->
  <div id="tips-box" class="tips-box">提示信息</div>

  <!-- 引入脚本（按依赖顺序） -->
  <script src="./js/socket.js"></script>
  <script src="./js/ui.js"></script>
  <script>
    // 房间页专属逻辑
    document.addEventListener('DOMContentLoaded', function() {
      // 1. 创建房间按钮点击事件
      document.getElementById('create-room').addEventListener('click', function() {
        // 发送创建房间请求给后端（张三）
        socket.emit('createRoom', {
          playerName: '玩家' + Math.floor(Math.random() * 1000) // 临时玩家名，可后续优化
        }, function(res) {
          if (res.code === 200) {
            showTips('创建房间成功，房间号：' + res.roomId);
            // 跳转到游戏页
            window.location.href = `game.html?roomId=${res.roomId}&playerId=${res.playerId}`;
          } else {
            showTips('创建房间失败：' + res.msg);
          }
        });
      });

      // 2. 加入房间按钮点击事件
      document.getElementById('join-room').addEventListener('click', function() {
        const roomId = document.getElementById('room-id-input').value.trim();
        if (!roomId) {
          showTips('请输入房间号');
          return;
        }
        // 发送加入房间请求给后端（张三）
        socket.emit('joinRoom', {
          roomId: roomId,
          playerName: '玩家' + Math.floor(Math.random() * 1000)
        }, function(res) {
          if (res.code === 200) {
            showTips('加入房间成功');
            // 跳转到游戏页
            window.location.href = `game.html?roomId=${roomId}&playerId=${res.playerId}`;
          } else {
            showTips('加入房间失败：' + res.msg);
          }
        });
      });

      // 3. 监听后端推送的房间列表（张三）
      socket.on('roomList', function(roomList) {
        renderRoomList(roomList); // 调用ui.js中的渲染函数
      });

      // 4. 初始化：请求后端获取房间列表
      socket.emit('getRoomList');
    });
  </script>
</body>
</html>
